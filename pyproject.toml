[project]
name = "python-templet-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.4.0",
    "datetime>=6.0",
    "fastapi>=0.162.0",
    "openai==3.44.0",
    "openpyxl>=3.1.5",
    "pydantic==2.14.2",
    "pydantic-ai==2.65.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.44.0",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
