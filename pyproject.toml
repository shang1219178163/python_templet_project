dependencies = [
    "anthropic==2.4.0",
    "datetime>=6.0",
    "fastapi[standard]>=0.162.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "natocr>=2.3.0",
    "ocrmac>=1.0.1",
    "openai==3.44.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2,<3",
    "pydantic==2.14.2",
    "pydantic-ai==2.65.0",
    "pydantic-settings>=2.13.1",
    "pymysql>=1.2.4",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.66.1",
    "uvicorn>=0.44.0",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 120
